[project]
name = "primer-designer"
version = "0.1.0"
description = "Diagnostic PCR primer design robust to viral drift: nearest-neighbour thermodynamics, conservation analysis, degenerate primers and primer-health alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bioinformatics", "pcr", "primer-design", "thermodynamics", "diagnostics"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
